<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>层压证明器</title>
<style>
  :root { --bd:#d7dde5; --mut:#66707d; --ok:#1a7f37; --bad:#c92a2a; --warn:#b25f00; --bg:#f5f7fa; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
         background:var(--bg); color:#1f2733; }
  header { background:#14324f; color:#fff; padding:12px 20px; display:flex; align-items:center; gap:16px; }
  header h1 { font-size:19px; margin:0; letter-spacing:1px; }
  header .sub { color:#aac3dc; font-size:12px; }
  nav { background:#1d4063; padding:0 16px; display:flex; gap:4px; }
  nav button { background:none; border:0; color:#cfe0f2; padding:11px 16px; cursor:pointer;
               font-size:14px; border-bottom:3px solid transparent; }
  nav button.active { color:#fff; border-bottom-color:#ffb020; background:#173450; }
  main { padding:16px 20px; max-width:1280px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:8px; padding:14px 16px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 10px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--mut); font-size:12px; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th,td { border:1px solid #e3e8ef; padding:5px 7px; text-align:left; vertical-align:top; }
  th { background:#eef2f7; font-weight:600; }
  input,select,button { font:inherit; }
  input[type=text],input[type=number],select { border:1px solid #c4ccd6; border-radius:5px; padding:4px 7px; }
  input.sm { width:74px; }
  button.btn { border:1px solid #2b5f92; background:#2b6cb0; color:#fff; border-radius:6px;
               padding:6px 14px; cursor:pointer; }
  button.btn.ghost { background:#fff; color:#2b5f92; }
  button.btn.danger { background:#fff; color:var(--bad); border-color:var(--bad); }
  .tag { display:inline-block; border-radius:10px; padding:1px 9px; font-size:11.5px; }
  .tag.pass { background:#e6f6ec; color:var(--ok); }
  .tag.fail { background:#fde8e8; color:var(--bad); }
  .tag.ood { background:#fff3e0; color:var(--warn); }
  .lot { font-family:ui-monospace,Menlo,monospace; font-size:11.5px; }
  pre { background:#0f1b27; color:#d5e3f2; padding:10px; border-radius:6px; overflow:auto;
        font-size:11.5px; max-height:340px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  details { margin-top:8px; }
  summary { cursor:pointer; font-size:12.5px; color:#2b5f92; }
  .viol { color:var(--bad); }
  .formula { font-family:ui-monospace,Menlo,monospace; font-size:11.5px; background:#f2f5f9;
             padding:2px 5px; border-radius:4px; }
  #toast { position:fixed; right:18px; bottom:18px; max-width:420px; }
  .toast-item { background:#233; color:#fff; padding:9px 13px; border-radius:6px; margin-top:8px; font-size:12.5px; }
  svg { max-width:100%; border:1px solid var(--bd); border-radius:6px; background:#fff; }
  .kbd { font-family:ui-monospace,Menlo,monospace; background:#eef2f7; padding:0 4px; border-radius:3px; }
</style>
</head>
<body>
<header>
  <h1>层压证明器</h1>
  <span class="sub">Laminate Prover · 对称叠层走线阻抗的最坏角落 / 固定种子抽样审查（单位显式 SI 化）</span>
</header>
<nav>
  <button data-tab="analyze" class="active">审查</button>
  <button data-tab="editor">叠层编辑</button>
  <button data-tab="formulas">公式与适用域</button>
  <button data-tab="runs">运行记录</button>
  <button data-tab="admin">导入 / 导出</button>
</nav>
<main>
  <section id="tab-analyze"></section>
  <section id="tab-editor" hidden></section>
  <section id="tab-formulas" hidden></section>
  <section id="tab-runs" hidden></section>
  <section id="tab-admin" hidden></section>
</main>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
